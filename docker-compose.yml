x-app-environment: &app-environment
  BOT_TOKEN: ${BOT_TOKEN:?BOT_TOKEN is required}
  BOT_MODE: ${BOT_MODE:-polling}
  WEBHOOK_BASE_URL: ${WEBHOOK_BASE_URL:-}
  WEBHOOK_PATH: ${WEBHOOK_PATH:-/telegram/webhook}
  WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
  WEB_SERVER_HOST: ${WEB_SERVER_HOST:-0.0.0.0}
  WEB_SERVER_PORT: ${WEB_SERVER_PORT:-8080}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-price_alerts}:${POSTGRES_PASSWORD:-price_alerts}@postgres:5432/${POSTGRES_DB:-price_alerts}
  REDIS_URL: redis://redis:6379/0
  PRICE_REFRESH_INTERVAL_SECONDS: ${PRICE_REFRESH_INTERVAL_SECONDS:-45}
  PROVIDER_TIMEOUT_SECONDS: ${PROVIDER_TIMEOUT_SECONDS:-10}
  PROVIDER_MAX_ATTEMPTS: ${PROVIDER_MAX_ATTEMPTS:-3}
  NOTIFICATION_MAX_ATTEMPTS: ${NOTIFICATION_MAX_ATTEMPTS:-5}
  RESERVOIR_BASE_URL: ${RESERVOIR_BASE_URL:-https://api.reservoir.tools}
  RESERVOIR_API_KEY: ${RESERVOIR_API_KEY:-}
  NFT_PROVIDERS: ${NFT_PROVIDERS:-opensea,reservoir}
  OPENSEA_BASE_URL: ${OPENSEA_BASE_URL:-https://api.opensea.io}
  OPENSEA_API_KEY: ${OPENSEA_API_KEY:-}
  OPENSEA_CHAIN: ${OPENSEA_CHAIN:-ethereum}

services:
  bot:
    build: .
    restart: unless-stopped
    environment:
      <<: *app-environment
    command: uv run price-alert-bot
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${WEB_SERVER_BIND:-127.0.0.1}:${WEB_SERVER_PORT:-8080}:${WEB_SERVER_PORT:-8080}"

  worker:
    build: .
    restart: unless-stopped
    environment:
      <<: *app-environment
    command: uv run price-alert-worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  migrate:
    build: .
    restart: "no"
    environment:
      <<: *app-environment
    command: uv run alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-price_alerts}
      POSTGRES_USER: ${POSTGRES_USER:-price_alerts}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-price_alerts}
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_BIND:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
