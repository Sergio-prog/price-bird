[project]
name = "tg-price-alerts"
version = "0.1.0"
description = "Price Bird Telegram bot for token, CEX pair, market-cap, and NFT floor alerts."
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13.1",
    "aiohttp>=3.10.10",
    "alembic>=1.13.3",
    "asyncpg>=0.29.0",
    "ccxt>=4.4.24",
    "cryptography>=48.0.0",
    "fluent-runtime>=0.4.0",
    "pydantic-settings>=2.6.1",
    "redis>=5.1.1",
    "sqlalchemy[asyncio]>=2.0.36",
    "typer>=0.12.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.1",
]

[project.scripts]
price-alert-bot = "app.main:main"
price-alert-worker = "app.worker:main"
price-alert-cli = "app.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 128
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
